<!doctype html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="6N65FHgfF3ORbaIVXO05h-jZpXeWmnsKpVDa9sb1T94" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{if hasmath}} {{insert head_katex.html }}     {{end}}
  {{if hascode}} {{insert head_highlight.html }}   {{end}}
  {{ insert head_mixin.html }}

  {{isdef title}}<title>{{fill title}} — David Islip</title>{{end}}

  <!-- Meta description (page-specific via @def description, falls back to global) -->
  <meta name="description" content="{{fill description}}">

  <!-- Per-page canonical, in the directory form the site's own links use.
       See hfun_canonical in utils.jl. -->
  <link rel="canonical" href="{{canonical}}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="David Islip Quant">
  <meta property="og:description" content="{{fill description}}">
  <meta property="og:url" content="{{canonical}}">
  <!-- Dedicated social-card image: the in-page headshot is 600px wide, below the
       1200px threshold LinkedIn/Facebook need to render a large card. -->
  <meta property="og:image" content="https://davidislip.github.io/assets/headshot-og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1402">
  <meta property="og:image:alt" content="David Islip">
  {{isdef title}}<meta property="og:title" content="{{fill title}} — David Islip">{{end}}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@DaveIslip">
  <meta name="twitter:description" content="{{fill description}}">
  {{isdef title}}<meta name="twitter:title" content="{{fill title}} — David Islip">{{end}}

  <!-- RSS feed discovery. Franklin writes the feed to /feed.xml — this used to
       advertise /feed, so every page on the site linked a 404. -->
  <link rel="alternate" type="application/rss+xml" title="David Islip Quant" href="https://davidislip.github.io/feed.xml">

  <!-- JSON-LD: Person schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "David Islip",
    "url": "https://davidislip.github.io/",
    "image": "https://davidislip.github.io/assets/headshot.jpg",
    "jobTitle": "Quantitative Researcher",
    "affiliation": {
      "@type": "Organization",
      "name": "Balyasny Asset Management",
      "url": "https://www.bamfunds.com/"
    },
    "worksFor": {
      "@type": "Organization",
      "name": "Balyasny Asset Management",
      "url": "https://www.bamfunds.com/"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "University of Toronto",
      "url": "https://www.utoronto.ca/"
    },
    "knowsAbout": [
      "Operations Research",
      "Mathematical Optimization",
      "Quantitative Risk Modeling",
      "Stochastic Programming",
      "Portfolio Optimization",
      "Machine Learning for Finance"
    ],
    "sameAs": [
      "https://github.com/davidislip",
      "https://www.linkedin.com/in/david-ryan-islip-1889798a/",
      "https://scholar.google.com/citations?user=1OSeaukAAAAJ&hl=en",
      "https://x.com/DaveIslip"
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{insert header.html}}
  <!-- Franklin emits the content as <div class="franklin-content"> and that
       markup is not ours to change, so the <main> landmark wraps it from here.
       It is closed in _layout/foot.html. -->
  <main id="main">

<!-- Content appended here -->
